<!doctype html>
<html lang="ko">
  <head>
    <title>용휘의 다이어리</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 28.6px;
        background-color: #ffffff;
      }

      .container {
        max-width: 73rem;
        margin: 0 auto;
      }

      .header {
        margin-bottom: 1.875rem;
      }

      .banner {
        margin-top: 20px;
      }

      .banner img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 16px;
        object-fit: cover;
      }

      .menu {
        display: flex;
        gap: 10px;
        margin-top: 24px;
      }

      .active_menu {
        color: black;
        font-weight: bold;
        border-bottom: 3px solid black;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        position: sticky;
        backdrop-filter: blur(10px);
      }

      .category {
        padding: 12px 16px 12px 16px;
        border: 1px solid #dddddd;
        border-radius: 10px;
        font-size: 14px;
      }

      .search {
        padding: 12px 16px 12px 16px;
        margin-left: 10px;
        border: 1px solid #dddddd;
        border-radius: 10px;
        font-size: 14px;
      }

      .write_diary {
        display: flex;
        padding: 12px 16px 12px 16px;
        border: none;
        border-radius: 8px;
        background-color: #111111;
        color: #ffffff;
        font-size: 14px;
        cursor: pointer;
      }

      .diary_area {
        display: grid;
        margin-top: 42px;
        grid-template-columns: repeat(4, 274px);
        grid-template-rows: repeat(3, 296px);
        gap: 24px;
      }

      .card {
        width: 274px;
        height: 296px;
        cursor: pointer;
      }

      .card_delete {
        position: absolute;
        top: -4px;
        right: 4px;
        width: 32px;
        height: 32px;
        cursor: pointer;
      }

      .thumbnail_img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 16px;
      }

      .card_thumbnail {
        display: flex;
        position: relative;
        justify-content: center;
        font-size: 100px;
        align-items: center;
        height: 208px;
        width: 274px;
        border-radius: 16px;
        margin-bottom: 16px;
        object-fit: cover;
      }

      .card_lower {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }

      .card_lower .tag {
        color: pink;
      }

      .pagenation {
        display: flex;
        justify-content: center;
        padding: 24px 0;
      }

      /* ---------- 사진목록(강아지) ---------- */

      .ratio_filter {
        display: flex;
        gap: 8px;
        margin-top: 42px;
      }

      .ratio_btn {
        padding: 10px 16px;
        border: 1px solid #dddddd;
        border-radius: 20px;
        background: #ffffff;
        font-size: 14px;
        cursor: pointer;
      }

      .ratio_btn.active {
        background: #111111;
        color: #ffffff;
        border-color: #111111;
      }

      .photo_grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
        margin-top: 24px;
      }

      /* 필터 버튼에 따라 카드 비율만 바뀜 (재렌더링 없이 CSS로 처리) */
      .photo_grid.ratio-1-1 .photo_card {
        aspect-ratio: 1 / 1;
      }

      .photo_grid.ratio-4-3 .photo_card {
        aspect-ratio: 4 / 3;
      }

      .photo_grid.ratio-3-4 .photo_card {
        aspect-ratio: 3 / 4;
      }

      .photo_card {
        position: relative;
        overflow: hidden;
        border-radius: 16px;
        background: linear-gradient(
          90deg,
          #eeeeee 25%,
          #f5f5f5 50%,
          #eeeeee 75%
        );
        background-size: 200% 100%;
        animation: skeleton_loading 1.4s ease-in-out infinite;
      }

      /* 로딩 끝나면 스켈레톤 애니메이션 정지 */
      .photo_card.loaded {
        animation: none;
        background: none;
      }

      .photo_card img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* 강아지 사진 비율 제각각 -> 여백 없이 꽉 채워 자르기 */
        display: block;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .photo_card img.loaded {
        opacity: 1;
      }

      @keyframes skeleton_loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      @media (max-width: 779px) {
        .photo_grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .footer {
        background-color: #f2f2f2;
        margin-top: 40px;
        padding: 30px 0;
      }

      .footer_content {
        max-width: 1168px;
        margin: 0 auto;
        padding: 0 16px;
      }

      .footer_content div {
        color: #888888;
        font-size: 14px;
      }

      /* ---------- 모달 공통 ---------- */

      .modal_overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }

      /* 중첩 모달(완료 알림, 삭제 확인)은 더 위에 떠야 함 */
      .modal_overlay.nested {
        z-index: 150;
      }

      .modal {
        width: 400px;
        max-width: 90vw;
        padding: 24px;
        background: #ffffff;
        border-radius: 16px;
      }

      .modal_title {
        margin: 0 0 20px 0;
        font-size: 18px;
      }

      .modal_field {
        margin-bottom: 16px;
      }

      .modal_label {
        display: block;
        font-size: 14px;
        margin-bottom: 8px;
      }

      .modal_options {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 14px;
      }

      .mood_option {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }

      .modal_input,
      .modal_textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #dddddd;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
      }

      .modal_textarea {
        height: 80px;
        resize: none;
      }

      .modal_actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }

      .modal_close_btn,
      .modal_submit_btn,
      .modal_secondary_btn,
      .modal_danger_btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      .modal_close_btn,
      .modal_secondary_btn {
        background: #f2f2f2;
      }

      .modal_submit_btn {
        background: #111111;
        color: #ffffff;
      }

      .modal_danger_btn {
        background: #e0433c;
        color: #ffffff;
      }

      /* 상세 모달 본문 */
      .detail_content {
        white-space: pre-wrap;
        line-height: 1.6;
        font-size: 14px;
        color: #333;
        min-height: 80px;
      }

      /* 완료/확인용 중앙정렬 모달 */
      .modal_center_text {
        text-align: center;
        margin: 8px 0 20px 0;
        font-size: 15px;
      }

      .scroll_top_btn {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        width: 3rem;
        height: 3rem;
        border: none;
        border-radius: 50%;
        background-color: #111111;
        color: #ffffff;
        font-size: 1.25rem;
        cursor: pointer;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* ---------- 토스트 ---------- */

      .toast {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: #111111;
        color: #ffffff;
        padding: 12px 22px;
        border-radius: 8px;
        font-size: 14px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
        z-index: 200; /* 모달보다 위 */
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ---------- 모바일 반응형 ---------- */

      @media (max-width: 779px) {
        body {
          padding: 1rem;
        }

        .toolbar {
          flex-direction: column;
          align-items: stretch;
          gap: 0.75rem;
        }

        .left_toolbar {
          display: flex;
          gap: 0.5rem;
        }

        .write_diary {
          width: 100%;
          justify-content: center;
        }
      }

      @media (max-width: 779px) {
        .diary_area {
          grid-template-columns: repeat(2, 1fr);
          grid-template-rows: none;
          gap: 1rem;
        }

        .card {
          width: 100%;
          height: auto;
        }

        .card_thumbnail {
          width: 100%;
          height: 40vw;
          max-height: 200px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>용휘의 다이어리</h1>

        <div class="banner">
          <img src="img/Rectangle 1.png" alt="배너 이미지" />
        </div>
      </div>

      <div class="menu">
        <div class="active_menu" id="menu_diary" data-menu="diary">
          일기보관함
        </div>
        <div id="menu_photo" data-menu="photo">사진보관함</div>
      </div>

      <!-- ---------- 일기보관함 화면 ---------- -->
      <div id="diary_page">
        <div class="toolbar">
          <div class="left_toolbar">
            <select class="category" id="category">
              <option value="">전체</option>
            </select>

            <input
              class="search"
              type="text"
              placeholder="검색어를 입력해주세요."
            />
          </div>
          <button class="write_diary" id="write_diary_btn">+ 일기쓰기</button>
        </div>

        <div class="diary_area" id="diary_area"></div>

        <div class="pagenation">
          <div class="pagenumber">1</div>
        </div>
      </div>

      <!-- ---------- 사진보관함 화면 (강아지 사진) ---------- -->
      <div id="photo_page" style="display: none">
        <div class="ratio_filter">
          <button class="ratio_btn active" data-ratio="1-1">기본형 1:1</button>
          <button class="ratio_btn" data-ratio="4-3">가로형 4:3</button>
          <button class="ratio_btn" data-ratio="3-4">세로형 3:4</button>
        </div>

        <div class="photo_grid ratio-1-1" id="photo_grid"></div>
      </div>
    </div>

    <!-- 푸터 구역 -->

    <div class="footer">
      <div class="footer_content">
        <h2 class="footer_title">용휘의 다이어리</h2>
        <div>대표 : 김용휘</div>
        <div>Copyright © 2024. {name} Co., Ltd</div>
      </div>
    </div>

    <!-- ---------- 모달 1: 일기 작성 ---------- -->

    <div class="modal_overlay" id="write_overlay" style="display: none">
      <div class="modal">
        <h2 class="modal_title">일기 쓰기</h2>

        <div class="modal_field">
          <label class="modal_label">오늘 기분은 어떠셨나요?</label>

          <div class="modal_options">
            <label class="mood_option">
              <input type="radio" name="mood" value="happy" checked />
              행복해요
            </label>
            <label class="mood_option">
              <input type="radio" name="mood" value="sad" />슬퍼요
            </label>
            <label class="mood_option">
              <input type="radio" name="mood" value="surprised" />놀랐어요
            </label>
            <label class="mood_option">
              <input type="radio" name="mood" value="angry" />화나요
            </label>
            <label class="mood_option">
              <input type="radio" name="mood" value="etc" />기타
            </label>
          </div>
        </div>

        <div class="modal_field">
          <label class="modal_label">제목</label>
          <input
            type="text"
            id="title_input"
            class="modal_input"
            placeholder="제목을 입력해주세요."
          />
        </div>

        <div class="modal_field">
          <label class="modal_label">내용</label>
          <textarea
            id="content_input"
            class="modal_textarea"
            placeholder="내용을 입력해 주세요."
          ></textarea>
        </div>

        <div class="modal_actions">
          <button class="modal_close_btn" id="write_close_btn">닫기</button>
          <button class="modal_submit_btn" id="write_submit_btn">
            등록하기
          </button>
        </div>
      </div>
    </div>

    <!-- ---------- 모달 2: 등록 완료 (중첩) ---------- -->

    <div
      class="modal_overlay nested"
      id="success_overlay"
      style="display: none"
    >
      <div class="modal">
        <p class="modal_center_text">등록이 완료되었습니다.</p>
        <div class="modal_actions" style="justify-content: center">
          <button class="modal_submit_btn" id="success_confirm_btn">
            확인
          </button>
        </div>
      </div>
    </div>

    <!-- ---------- 모달 3: 일기 상세 ---------- -->

    <div class="modal_overlay" id="detail_overlay" style="display: none">
      <div class="modal">
        <h2 class="modal_title" id="detail_title"></h2>
        <div class="card_lower" style="margin-bottom: 12px">
          <span class="tag" id="detail_tag"></span>
          <span class="date" id="detail_date"></span>
        </div>
        <p class="detail_content" id="detail_content"></p>

        <div class="modal_actions">
          <button class="modal_secondary_btn" id="detail_close_btn">
            닫기
          </button>
          <button class="modal_secondary_btn" id="detail_copy_btn">복사</button>
          <button class="modal_danger_btn" id="detail_delete_btn">삭제</button>
        </div>
      </div>
    </div>

    <!-- ---------- 모달 4: 삭제 확인 (중첩) ---------- -->

    <div
      class="modal_overlay nested"
      id="delete_confirm_overlay"
      style="display: none"
    >
      <div class="modal">
        <p class="modal_center_text">정말 삭제하시겠어요?</p>
        <div class="modal_actions" style="justify-content: center">
          <button class="modal_secondary_btn" id="delete_cancel_btn">
            취소
          </button>
          <button class="modal_danger_btn" id="delete_ok_btn">삭제</button>
        </div>
      </div>
    </div>

    <button id="scroll_top_btn" class="scroll_top_btn">⬆️</button>

    <!-- ---------- 토스트 ---------- -->
    <div id="toast" class="toast">복사되었습니다.</div>

    <script>
      // =========================================================
      // 0. 모달 공통 헬퍼
      //    - 중첩 모달 대비 스택으로 관리 (ESC는 항상 "맨 위" 모달만 닫음)
      //    - 열릴 때: 스크롤 맨 위로 + 배경 스크롤 락
      //    - 닫힐 때: 스택이 비면 배경 스크롤 락 해제
      // =========================================================

      let openModalStack = [];

      function openModal(overlayEl) {
        if (openModalStack.length === 0) {
          // 최초로 열리는 모달일 때만 스크롤 top 이동 + 배경 락
          window.scrollTo({ top: 0, behavior: "instant" });
          document.body.style.overflow = "hidden";
        }
        overlayEl.style.display = "flex";
        openModalStack.push(overlayEl);
      }

      function closeModal(overlayEl) {
        overlayEl.style.display = "none";
        openModalStack = openModalStack.filter((m) => m !== overlayEl);
        if (openModalStack.length === 0) {
          document.body.style.overflow = "";
        }
      }

      function bindOverlayClose(overlayEl) {
        overlayEl.addEventListener("click", (e) => {
          if (e.target === overlayEl) closeModal(overlayEl);
        });
      }

      // ESC : 스택 맨 위(가장 최근에 연) 모달부터 닫기
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && openModalStack.length > 0) {
          closeModal(openModalStack[openModalStack.length - 1]);
        }
      });

      // =========================================================
      // 1. 엘리먼트 참조
      // =========================================================

      const writeBtn = document.getElementById("write_diary_btn");
      const writeOverlay = document.getElementById("write_overlay");
      const writeCloseBtn = document.getElementById("write_close_btn");
      const writeSubmitBtn = document.getElementById("write_submit_btn");

      const successOverlay = document.getElementById("success_overlay");
      const successConfirmBtn = document.getElementById("success_confirm_btn");

      const detailOverlay = document.getElementById("detail_overlay");
      const detailCloseBtn = document.getElementById("detail_close_btn");
      const detailCopyBtn = document.getElementById("detail_copy_btn");
      const detailDeleteBtn = document.getElementById("detail_delete_btn");

      const deleteConfirmOverlay = document.getElementById(
        "delete_confirm_overlay",
      );
      const deleteCancelBtn = document.getElementById("delete_cancel_btn");
      const deleteOkBtn = document.getElementById("delete_ok_btn");

      const toast = document.getElementById("toast");

      [
        writeOverlay,
        successOverlay,
        detailOverlay,
        deleteConfirmOverlay,
      ].forEach(bindOverlayClose);

      // =========================================================
      // 2. 무드별 이미지/색상
      // =========================================================

      const MOOD_CONFIG = {
        happy: {
          label: "행복해요",
          image: "img/행복해요 (m).png",
          color: "#ffd6e0",
        },
        sad: {
          label: "슬퍼요",
          image: "img/슬퍼요 (m).png",
          color: "#cdeaf9",
        },
        surprised: {
          label: "놀랐어요",
          image: "img/놀랐어요 (m).png",
          color: "#fdf1c7",
        },
        angry: {
          label: "화나요",
          image: "img/화나요 (m).png",
          color: "#e5e5e5",
        },
        etc: { label: "기타", image: "img/기타 (m).png", color: "#e3d9f7" },
      };

      // =========================================================
      // 3. localStorage
      // =========================================================

      const STORAGE_KEY = "diaries";

      function saveDiaries() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(diaries));
      }

      function loadDiaries() {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : [];
      }

      // =========================================================
      // 4. 데이터 + 화면 그리기
      // =========================================================

      let diaries = loadDiaries();
      let currentDetailId = null; // 상세/삭제 흐름에서 현재 대상 id

      function render() {
        const area = document.getElementById("diary_area");
        area.innerHTML = diaries
          .map((d) => {
            const mood = MOOD_CONFIG[d.mood];
            return `
        <div class="card" data-diary-id="${d.id}">
          <div class="card_thumbnail" style="background-color:${mood.color}">
            <img src="${mood.image}" class="thumbnail_img" alt="${mood.label}" />
            <img src="img/close_outline_light_m.svg" alt="x" class="card_delete" />
          </div>
          <div class="card_lower">
            <span class="tag" style="color:${mood.color}">${mood.label}</span>
            <span class="date">${d.date}</span>
          </div>
          <h3 class="card_title">${d.title}</h3>
        </div>
      `;
          })
          .join("");
      }

      render(); // 최초 화면 그리기

      // =========================================================
      // 5. 일기 등록 (모달 → 등록 → 완료 중첩모달)
      // =========================================================

      writeBtn.addEventListener("click", () => openModal(writeOverlay));
      writeCloseBtn.addEventListener("click", () => closeModal(writeOverlay));

      function addDiary(mood, title, content) {
        diaries.push({
          id: Date.now(),
          mood,
          title,
          content,
          date: new Date().toLocaleDateString("ko-KR"),
        });
        saveDiaries();
        render();
      }

      writeSubmitBtn.addEventListener("click", () => {
        const mood = document.querySelector(
          'input[name="mood"]:checked',
        )?.value;
        const title = document.getElementById("title_input")?.value.trim();
        const content = document.getElementById("content_input").value.trim();

        // 엣지케이스: 필수값(기분/제목) 누락 시 등록 막기
        if (!mood || !title) {
          alert("기분과 제목은 필수에요!");
          return;
        }

        addDiary(mood, title, content);

        document.getElementById("title_input").value = "";
        document.getElementById("content_input").value = "";

        closeModal(writeOverlay);
        openModal(successOverlay); // 등록 완료 중첩 모달
      });

      successConfirmBtn.addEventListener("click", () => {
        closeModal(successOverlay);
      });

      // =========================================================
      // 6. 일기 상세 / 복사 / 삭제
      // =========================================================

      document.getElementById("diary_area").addEventListener("click", (e) => {
        const card = e.target.closest(".card");
        if (!card) return;

        const id = Number(card.dataset.diaryId);

        // 카드의 x 아이콘 클릭 → 바로 삭제 확인 모달로 (상세 안 거침)
        if (e.target.classList.contains("card_delete")) {
          currentDetailId = id;
          openModal(deleteConfirmOverlay);
          return;
        }

        // 카드 본문 클릭 → 상세 모달
        currentDetailId = id;
        const diary = diaries.find((d) => d.id === id);
        if (!diary) return; // 엣지케이스: 삭제 직후 잔여 클릭 등

        const mood = MOOD_CONFIG[diary.mood];
        document.getElementById("detail_title").textContent = diary.title;
        document.getElementById("detail_tag").textContent = mood.label;
        document.getElementById("detail_tag").style.color = mood.color;
        document.getElementById("detail_date").textContent = diary.date;
        document.getElementById("detail_content").textContent =
          diary.content || "(내용 없음)";

        openModal(detailOverlay);
      });

      detailCloseBtn.addEventListener("click", () => {
        closeModal(detailOverlay);
      });

      // ---- 복사: 클립보드 + 하단 토스트 ----
      let toastTimer = null; // 연타 시 타이머 중복 방지용

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");

        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 2000);
      }

      detailCopyBtn.addEventListener("click", () => {
        const text = document.getElementById("detail_content").textContent;

        // 엣지케이스: clipboard API는 HTTPS/localhost 환경에서만 정상 동작
        if (!navigator.clipboard) {
          showToast("이 환경에서는 복사를 지원하지 않아요.");
          return;
        }

        navigator.clipboard
          .writeText(text)
          .then(() => showToast("복사되었습니다."))
          .catch(() => showToast("복사에 실패했어요."));
      });

      // ---- 삭제 확인 ----
      function deleteDiary(id) {
        diaries = diaries.filter((d) => d.id !== id);
        saveDiaries();
        render();
      }

      detailDeleteBtn.addEventListener("click", () => {
        openModal(deleteConfirmOverlay); // 상세 위에 중첩으로 뜸
      });

      deleteCancelBtn.addEventListener("click", () => {
        closeModal(deleteConfirmOverlay);
      });

      deleteOkBtn.addEventListener("click", () => {
        if (currentDetailId === null) return;
        deleteDiary(currentDetailId);
        closeModal(deleteConfirmOverlay);
        closeModal(detailOverlay); // 상세 모달도 같이 닫기 (열려있었다면)
        currentDetailId = null;
      });

      // =========================================================
      // 7. 일기보관함 / 사진보관함 탭 전환
      // =========================================================

      const menuDiary = document.getElementById("menu_diary");
      const menuPhoto = document.getElementById("menu_photo");
      const diaryPage = document.getElementById("diary_page");
      const photoPage = document.getElementById("photo_page");

      let dogPhotosLoaded = false; // 최초 1회만 fetch (탭 왔다갔다 할 때마다 다시 부르지 않도록)

      function switchMenu(target) {
        const isDiary = target === "diary";

        menuDiary.classList.toggle("active_menu", isDiary);
        menuPhoto.classList.toggle("active_menu", !isDiary);

        diaryPage.style.display = isDiary ? "" : "none";
        photoPage.style.display = isDiary ? "none" : "";

        // 사진보관함 탭에 처음 들어올 때만 강아지 사진을 불러옴
        if (!isDiary && !dogPhotosLoaded) {
          dogPhotosLoaded = true;
          renderPhotoGrid();
        }
      }

      menuDiary.addEventListener("click", () => switchMenu("diary"));
      menuPhoto.addEventListener("click", () => switchMenu("photo"));

      // =========================================================
      // 8. 사진보관함 - 강아지 사진 (fetch + 컴포넌트 + 스켈레톤 + 비율필터)
      // =========================================================

      const DOG_API_URL = "https://dog.ceo/api/breeds/image/random/10"; // 한 번에 10장

      // ---- 8-1. fetch: 강아지 이미지 URL 10개 가져오기 ----
      async function fetchDogImages(count = 10) {
        try {
          const res = await fetch(
            `https://dog.ceo/api/breeds/image/random/${count}`,
          );

          // 엣지케이스: 네트워크는 됐지만 API가 200이 아닌 경우
          if (!res.ok) throw new Error("dog api response not ok");

          const data = await res.json();
          return data.message; // 이미지 URL 배열
        } catch (err) {
          console.error("강아지 이미지 로드 실패:", err);
          return []; // 엣지케이스: 실패해도 화면이 안 죽도록 빈 배열 반환
        }
      }

      // ---- 8-2. 컴포넌트: 카드 하나 만들기 (재사용 가능한 단위) ----
      function createPhotoCard(url) {
        const card = document.createElement("div");
        card.className = "photo_card";

        const img = document.createElement("img");
        img.src = url;
        img.alt = "강아지 사진";

        // 이미지 로드가 끝나면 스켈레톤 -> 실제 이미지로 전환
        img.addEventListener("load", () => {
          img.classList.add("loaded");
          card.classList.add("loaded");
        });

        // 엣지케이스: 이미지 로드 자체가 실패하면 스켈레톤만 계속 도는 걸 방지
        img.addEventListener("error", () => {
          card.classList.add("loaded");
          card.style.background = "#f2f2f2";
        });

        card.appendChild(img);
        return card;
      }

      // ---- 8-3. 그리드 전체 그리기 ----
      async function renderPhotoGrid() {
        const grid = document.getElementById("photo_grid");
        grid.innerHTML = "";

        const urls = await fetchDogImages(10);

        if (urls.length === 0) {
          grid.innerHTML =
            '<p style="grid-column: 1 / -1; text-align:center; color:#888;">사진을 불러오지 못했어요. 새로고침 해주세요.</p>';
          return;
        }

        urls.forEach((url) => {
          grid.appendChild(createPhotoCard(url));
        });
      }

      // ---- 8-4. 비율 필터 버튼 ----
      document.querySelectorAll(".ratio_btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".ratio_btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");

          const grid = document.getElementById("photo_grid");
          // 클래스만 교체 -> 이미지는 그대로 두고 CSS aspect-ratio만 바뀜 (재요청 없음)
          grid.className = "photo_grid ratio-" + btn.dataset.ratio;
        });
      });

      // =========================================================
      // 9. 맨 위로 버튼
      // =========================================================

      const scrollTopBtn = document.getElementById("scroll_top_btn");

      window.addEventListener("scroll", () => {
        if (window.scrollY > 300) {
          scrollTopBtn.style.display = "flex";
        } else {
          scrollTopBtn.style.display = "none";
        }
      });

      scrollTopBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    </script>
  </body>
</html>
